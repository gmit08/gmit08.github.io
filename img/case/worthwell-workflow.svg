<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Worthwell seller workflow</title>
  <desc id="desc">Six built steps: setup questions, a room or item photo, AI vision appraisal, web comps for items 100 dollars and up, the seller approving or editing each price, then the item board with a revenue total and CSV export.</desc>
  <defs>
    <style>
      .bg{fill:#FBFAF7}
      .k{font:600 13px Inter,system-ui,sans-serif;fill:#5B8DC9;letter-spacing:.02em}
      .card{fill:#fff;stroke:#EAF1F8;stroke-width:2}
      .card-hitl{fill:#fff;stroke:#C9A45C;stroke-width:2.25}
      .num{font:800 16px Inter,system-ui,sans-serif;fill:#fff}
      .num-hitl{font:800 16px Inter,system-ui,sans-serif;fill:#1E3557}
      .label{font:700 16px Inter,system-ui,sans-serif;fill:#1E3557;letter-spacing:-.03em}
      .sub{font:500 12.5px Inter,system-ui,sans-serif;fill:#4a5d75}
      .pill{font:700 10px Inter,system-ui,sans-serif;fill:#1E3557;letter-spacing:.02em}
      .icon{fill:none;stroke:#5B8DC9;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .icon-hitl{fill:none;stroke:#C9A45C;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#5B8DC9;stroke-width:2.2;stroke-linecap:round}
    </style>
    <marker id="ww-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 Z" fill="#5B8DC9"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="540" rx="4"/>
  <text class="k" x="36" y="40">Worthwell seller workflow</text>
  <text class="sub" x="36" y="64">The path that is built in the private-beta app. Every price stays a draft until the seller approves or edits it.</text>

  <!-- 6 cards: w=172, gap=16, start x=36; 6*172=1032 + 5*16=80 + 36 = 1148, right pad 52. Use w=176, gap=14, x=32: 6*176=1056+70+32=1158. Better: w=174, gap=16, x=28: 1044+80+28=1152. -->

  <g transform="translate(28,88)">
    <rect class="card" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#1E3557"/>
    <text class="num" x="28" y="34" text-anchor="middle">1</text>
    <g class="icon" transform="translate(67,86)">
      <rect x="4" y="2" width="32" height="40" rx="3"/>
      <path d="M12 14 h16M12 22 h16M12 30 h10"/>
    </g>
    <text class="label" x="87" y="176" text-anchor="middle">Setup questions</text>
    <text class="sub" x="87" y="206" text-anchor="middle">Deadline, plan, how</text>
    <text class="sub" x="87" y="224" text-anchor="middle">to sell, location,</text>
    <text class="sub" x="87" y="242" text-anchor="middle">and whose home.</text>
    <text class="sub" x="87" y="268" text-anchor="middle">Timeline is asked</text>
    <text class="sub" x="87" y="286" text-anchor="middle">before the first</text>
    <text class="sub" x="87" y="304" text-anchor="middle">appraisal.</text>
  </g>

  <g transform="translate(218,88)">
    <rect class="card" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#1E3557"/>
    <text class="num" x="28" y="34" text-anchor="middle">2</text>
    <g class="icon" transform="translate(67,90)">
      <path d="M8 14 h24 a5 5 0 0 1 5 5 v20 a5 5 0 0 1-5 5 H8 a5 5 0 0 1-5-5 V19 a5 5 0 0 1 5-5z"/>
      <circle cx="20" cy="31" r="7"/>
      <path d="M14 14 l3-7 h12 l3 7"/>
    </g>
    <text class="label" x="87" y="176" text-anchor="middle">Room photo</text>
    <text class="sub" x="87" y="206" text-anchor="middle">One photo of a room,</text>
    <text class="sub" x="87" y="224" text-anchor="middle">or a single item.</text>
    <text class="sub" x="87" y="250" text-anchor="middle">Name the room, then</text>
    <text class="sub" x="87" y="268" text-anchor="middle">mark it done.</text>
  </g>

  <g transform="translate(408,88)">
    <rect class="card" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#1E3557"/>
    <text class="num" x="28" y="34" text-anchor="middle">3</text>
    <g class="icon" transform="translate(67,88)">
      <circle cx="20" cy="22" r="12"/>
      <path d="M20 10 v4M20 30 v4M8 22 h4M28 22 h4"/>
      <circle cx="20" cy="22" r="3"/>
      <path d="M8 42 h24"/>
    </g>
    <text class="label" x="87" y="168" text-anchor="middle">AI vision</text>
    <text class="label" x="87" y="188" text-anchor="middle">appraisal</text>
    <text class="sub" x="87" y="218" text-anchor="middle">Each photo is read</text>
    <text class="sub" x="87" y="236" text-anchor="middle">and every sellable</text>
    <text class="sub" x="87" y="254" text-anchor="middle">item gets a price</text>
    <text class="sub" x="87" y="272" text-anchor="middle">range.</text>
  </g>

  <g transform="translate(598,88)">
    <rect class="card" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#1E3557"/>
    <text class="num" x="28" y="34" text-anchor="middle">4</text>
    <g class="icon" transform="translate(67,88)">
      <circle cx="18" cy="20" r="10"/>
      <path d="M25 27 L36 38"/>
      <path d="M8 46 h28"/>
    </g>
    <text class="label" x="87" y="168" text-anchor="middle">Web comps</text>
    <text class="label" x="87" y="188" text-anchor="middle">for $100+</text>
    <text class="sub" x="87" y="218" text-anchor="middle">Public listing comps,</text>
    <text class="sub" x="87" y="236" text-anchor="middle">on request.</text>
    <text class="sub" x="87" y="262" text-anchor="middle">Asking prices stay</text>
    <text class="sub" x="87" y="280" text-anchor="middle">separate from</text>
    <text class="sub" x="87" y="298" text-anchor="middle">confirmed sales.</text>
  </g>

  <g transform="translate(788,88)">
    <rect class="card-hitl" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#C9A45C"/>
    <text class="num-hitl" x="28" y="34" text-anchor="middle">5</text>
    <rect x="42" y="16" width="116" height="20" rx="10" fill="#F7EED9"/>
    <text class="pill" x="100" y="30" text-anchor="middle">HUMAN IN THE LOOP</text>
    <g class="icon-hitl" transform="translate(67,88)">
      <circle cx="16" cy="14" r="8"/>
      <path d="M2 42 a14 14 0 0 1 28 0"/>
      <path d="M26 12 l6 6 12-14"/>
    </g>
    <text class="label" x="87" y="168" text-anchor="middle">Seller approves</text>
    <text class="label" x="87" y="188" text-anchor="middle">or edits</text>
    <text class="sub" x="87" y="218" text-anchor="middle">Every price is a draft</text>
    <text class="sub" x="87" y="236" text-anchor="middle">until the seller</text>
    <text class="sub" x="87" y="254" text-anchor="middle">approves or edits it.</text>
    <text class="sub" x="87" y="280" text-anchor="middle">A timeline change</text>
    <text class="sub" x="87" y="298" text-anchor="middle">also needs</text>
    <text class="sub" x="87" y="316" text-anchor="middle">confirmation.</text>
  </g>

  <g transform="translate(978,88)">
    <rect class="card" width="174" height="396" rx="6"/>
    <circle cx="28" cy="28" r="16" fill="#1E3557"/>
    <text class="num" x="28" y="34" text-anchor="middle">6</text>
    <g class="icon" transform="translate(67,86)">
      <rect x="2" y="6" width="36" height="28" rx="3"/>
      <path d="M8 16 h24M8 24 h16"/>
      <path d="M8 42 h10M22 42 h16"/>
    </g>
    <text class="label" x="87" y="176" text-anchor="middle">Item board</text>
    <text class="sub" x="87" y="206" text-anchor="middle">Status, filters,</text>
    <text class="sub" x="87" y="224" text-anchor="middle">and merge or split.</text>
    <text class="sub" x="87" y="250" text-anchor="middle">A running revenue</text>
    <text class="sub" x="87" y="268" text-anchor="middle">total, and a CSV</text>
    <text class="sub" x="87" y="286" text-anchor="middle">export.</text>
  </g>

  <g class="arrow" marker-end="url(#ww-arr)">
    <path d="M202 286 H214"/>
    <path d="M392 286 H404"/>
    <path d="M582 286 H594"/>
    <path d="M772 286 H784"/>
    <path d="M962 286 H974"/>
  </g>
</svg>
