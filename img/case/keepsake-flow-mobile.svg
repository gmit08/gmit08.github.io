<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc">
  <title id="title">Keepsake decision-support flow</title>
  <desc id="desc">Four steps: photo intake, an AI pricing suggestion with sources, human approval, then the sale.</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .k{font:600 12px Inter,system-ui,sans-serif;fill:#a24ca1;letter-spacing:.02em}
      .card{fill:#f5f5f5;stroke:#e8e8e8;stroke-width:1}
      .num{font:800 15px Inter,system-ui,sans-serif;fill:#fff}
      .label{font:700 17px Inter,system-ui,sans-serif;fill:#000;letter-spacing:-.03em}
      .sub{font:500 13px Inter,system-ui,sans-serif;fill:#555}
      .icon{fill:none;stroke:#a24ca1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#3d5af1;stroke-width:2;stroke-linecap:round}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 Z" fill="#3d5af1"/>
    </marker>
  </defs>
  <rect class="bg" width="390" height="760" rx="4"/>
  <text class="k" x="20" y="32">Keepsake decision-support flow</text>

  <!-- 4 stacked cards, 64px tall? That's tight. Use 150px cards with icon at left. -->
  <!-- Better: compact rows 148px, gap, arrows between. y start 52. 4*148=592 + 3*28 arrows=84 + 52 + 20 = 748. Height 820 ok. -->

  <g transform="translate(20,50)">
    <rect class="card" width="350" height="148" rx="4"/>
    <circle cx="32" cy="32" r="16" fill="#a24ca1"/>
    <text class="num" x="32" y="37" text-anchor="middle">1</text>
    <g class="icon" transform="translate(268,44)">
      <path d="M8 14 h28 a5 5 0 0 1 5 5 v18 a5 5 0 0 1-5 5 H8 a5 5 0 0 1-5-5 V19 a5 5 0 0 1 5-5z"/>
      <circle cx="22" cy="30" r="7"/>
      <path d="M14 14 l3-7 h10 l3 7"/>
    </g>
    <text class="label" x="58" y="78">Photo intake</text>
    <text class="sub" x="58" y="104">Room-by-room photos become inventory records</text>
  </g>

  <g transform="translate(20,226)">
    <rect class="card" width="350" height="148" rx="4"/>
    <circle cx="32" cy="32" r="16" fill="#a24ca1"/>
    <text class="num" x="32" y="37" text-anchor="middle">2</text>
    <g class="icon" transform="translate(268,42)">
      <path d="M6 20 L20 6 h14 a3 3 0 0 1 3 3 v14 L22 38 a5 5 0 0 1-7 0 L6 28 a5 5 0 0 1 0-8z"/>
      <circle cx="27" cy="15" r="2" fill="#a24ca1" stroke="none"/>
      <path d="M8 48 h28"/><path d="M8 56 h18"/>
    </g>
    <text class="label" x="58" y="78">AI pricing suggestion</text>
    <text class="sub" x="58" y="104">A suggested value, with source links I can check</text>
  </g>

  <g transform="translate(20,402)">
    <rect class="card" width="350" height="148" rx="4"/>
    <circle cx="32" cy="32" r="16" fill="#a24ca1"/>
    <text class="num" x="32" y="37" text-anchor="middle">3</text>
    <g class="icon" transform="translate(272,48)">
      <circle cx="16" cy="13" r="8"/>
      <path d="M2 42 a14 14 0 0 1 28 0"/>
      <path d="M26 12 l5 5 10-12"/>
    </g>
    <text class="label" x="58" y="78">Human approval</text>
    <text class="sub" x="58" y="104">I approve, edit, or reject. Keep, sell, or donate.</text>
  </g>

  <g transform="translate(20,578)">
    <rect class="card" width="350" height="148" rx="4"/>
    <circle cx="32" cy="32" r="16" fill="#a24ca1"/>
    <text class="num" x="32" y="37" text-anchor="middle">4</text>
    <g class="icon" transform="translate(272,50)">
      <path d="M6 16 h32 l-3 26 H9 z"/>
      <path d="M16 16 v-5 a6 6 0 0 1 12 0 v5"/>
    </g>
    <text class="label" x="58" y="78">Sale</text>
    <text class="sub" x="58" y="104">Priced, staged, and sold on a live estate sale</text>
  </g>

  <g class="arrow" marker-end="url(#arr)">
    <path d="M195 202 V218"/>
    <path d="M195 378 V394"/>
    <path d="M195 554 V570"/>
  </g>
</svg>
