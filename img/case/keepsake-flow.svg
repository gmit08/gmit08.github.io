<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Keepsake decision-support flow</title>
  <desc id="desc">Four steps: photo intake, an AI pricing suggestion with sources, human approval, then the sale.</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .k{font:600 13px Inter,system-ui,sans-serif;fill:#a24ca1;letter-spacing:.02em}
      .card{fill:#f5f5f5;stroke:#e8e8e8;stroke-width:1}
      .num{font:800 18px Inter,system-ui,sans-serif;fill:#fff}
      .label{font:700 20px Inter,system-ui,sans-serif;fill:#000;letter-spacing:-.03em}
      .sub{font:500 14px Inter,system-ui,sans-serif;fill:#555}
      .icon{fill:none;stroke:#a24ca1;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .arrow{fill:none;stroke:#3d5af1;stroke-width:2.25;stroke-linecap:round}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 Z" fill="#3d5af1"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="480" rx="4"/>
  <text class="k" x="48" y="48">Keepsake decision-support flow</text>

  <!-- cards: 4 x 240, gap 40, start x=48, y=84, height 340 -->
  <!-- 48 + 4*240 + 3*40 = 48+960+120=1128, remaining right pad 72. Tighten: gap 32, start 48, 4*248=992 + 96 + 48 = 1136. Use w=250, gap=36, x=48: 48+1000+108=1156, pad 44. Good. -->

  <g transform="translate(48,88)">
    <rect class="card" width="246" height="336" rx="4"/>
    <circle cx="36" cy="36" r="18" fill="#a24ca1"/>
    <text class="num" x="36" y="42" text-anchor="middle">1</text>
    <!-- camera icon -->
    <g class="icon" transform="translate(99,118)">
      <path d="M8 16 h32 a6 6 0 0 1 6 6 v22 a6 6 0 0 1-6 6 H8 a6 6 0 0 1-6-6 V22 a6 6 0 0 1 6-6z"/>
      <circle cx="24" cy="35" r="8"/>
      <path d="M16 16 l3-8 h10 l3 8"/>
    </g>
    <text class="label" x="123" y="236" text-anchor="middle">Photo intake</text>
    <text class="sub" x="123" y="264" text-anchor="middle">Room-by-room photos</text>
    <text class="sub" x="123" y="284" text-anchor="middle">become inventory records</text>
  </g>

  <g transform="translate(334,88)">
    <rect class="card" width="246" height="336" rx="4"/>
    <circle cx="36" cy="36" r="18" fill="#a24ca1"/>
    <text class="num" x="36" y="42" text-anchor="middle">2</text>
    <!-- tag / sources icon: price tag + check lines -->
    <g class="icon" transform="translate(99,114)">
      <path d="M6 22 L22 6 h16 a4 4 0 0 1 4 4 v16 L26 42 a6 6 0 0 1-8 0 L6 30 a6 6 0 0 1 0-8z"/>
      <circle cx="30" cy="16" r="2.2" fill="#a24ca1" stroke="none"/>
      <path d="M8 48 h32" opacity=".85"/>
      <path d="M8 56 h22" opacity=".85"/>
    </g>
    <text class="label" x="123" y="236" text-anchor="middle">AI pricing suggestion</text>
    <text class="sub" x="123" y="264" text-anchor="middle">A suggested value, with</text>
    <text class="sub" x="123" y="284" text-anchor="middle">source links I can check</text>
  </g>

  <g transform="translate(620,88)">
    <rect class="card" width="246" height="336" rx="4"/>
    <circle cx="36" cy="36" r="18" fill="#a24ca1"/>
    <text class="num" x="36" y="42" text-anchor="middle">3</text>
    <!-- person + check -->
    <g class="icon" transform="translate(99,118)">
      <circle cx="20" cy="16" r="9"/>
      <path d="M4 48 a16 16 0 0 1 32 0"/>
      <path d="M30 14 l6 6 12-14"/>
    </g>
    <text class="label" x="123" y="236" text-anchor="middle">Human approval</text>
    <text class="sub" x="123" y="264" text-anchor="middle">I approve, edit, or reject</text>
    <text class="sub" x="123" y="284" text-anchor="middle">Keep, sell, or donate</text>
  </g>

  <g transform="translate(906,88)">
    <rect class="card" width="246" height="336" rx="4"/>
    <circle cx="36" cy="36" r="18" fill="#a24ca1"/>
    <text class="num" x="36" y="42" text-anchor="middle">4</text>
    <!-- bag / sale -->
    <g class="icon" transform="translate(99,118)">
      <path d="M8 20 h32 l-3 28 H11 z"/>
      <path d="M18 20 v-6 a6 6 0 0 1 12 0 v6"/>
    </g>
    <text class="label" x="123" y="236" text-anchor="middle">Sale</text>
    <text class="sub" x="123" y="264" text-anchor="middle">Priced, staged, and sold</text>
    <text class="sub" x="123" y="284" text-anchor="middle">on a live estate sale</text>
  </g>

  <!-- arrows between cards -->
  <g class="arrow" marker-end="url(#arr)">
    <path d="M298 256 H326"/>
    <path d="M584 256 H612"/>
    <path d="M870 256 H898"/>
  </g>
</svg>
