<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Worthwell system architecture</title>
  <desc id="desc">The Worthwell app, built with TanStack Start, talks to a tested deterministic pricing module and an IndexedDB cache. Calls go first to OpenAI, using GPT-6 Astra for vision appraisal and built-in web search for comps, up to five US resale listings. The Lovable AI gateway is a fallback when there is no key or the call fails. Lovable Cloud holds Postgres, authentication, private photo storage, and owner-only rules. Human approval points: the seller approves or edits each price, and a timeline change needs confirmation.</desc>
  <defs>
    <style>
      .bg{fill:#FBFAF7}
      .k{font:600 13px Inter,system-ui,sans-serif;fill:#5B8DC9;letter-spacing:.02em}
      .box{fill:#fff;stroke:#EAF1F8;stroke-width:2}
      .app{fill:#fff;stroke:#5B8DC9;stroke-width:2}
      .cloud{fill:#EAF1F8;stroke:#5B8DC9;stroke-width:2}
      .hitl{fill:#F7EED9;stroke:#C9A45C;stroke-width:2.25}
      .inner{fill:#FBFAF7;stroke:#EAF1F8;stroke-width:1.5}
      .fallback{fill:#fff;stroke:#5B8DC9;stroke-width:2;stroke-dasharray:7 5}
      .title{font:700 18px Inter,system-ui,sans-serif;fill:#1E3557;letter-spacing:-.03em}
      .label{font:700 15px Inter,system-ui,sans-serif;fill:#1E3557;letter-spacing:-.03em}
      .sub{font:500 12.5px Inter,system-ui,sans-serif;fill:#4a5d75}
      .pill{font:700 10px Inter,system-ui,sans-serif;fill:#1E3557;letter-spacing:.02em}
      .arrow{fill:none;stroke:#5B8DC9;stroke-width:2;stroke-linecap:round}
      .arrow-hitl{fill:none;stroke:#C9A45C;stroke-width:2.2;stroke-linecap:round}
      .arrow-dash{fill:none;stroke:#5B8DC9;stroke-width:2;stroke-linecap:round;stroke-dasharray:7 5}
    </style>
    <marker id="wa-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 Z" fill="#5B8DC9"/>
    </marker>
    <marker id="wa-arr-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 Z" fill="#C9A45C"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="820" rx="4"/>
  <text class="k" x="36" y="40">Worthwell system architecture</text>
  <text class="sub" x="36" y="64">Built pieces only. Gold marks human approval. The dashed box is a fallback, used only when the primary path cannot run.</text>

  <g transform="translate(390,88)">
    <rect class="hitl" width="420" height="96" rx="6"/>
    <text class="title" x="210" y="36" text-anchor="middle">Seller</text>
    <rect x="28" y="52" width="174" height="28" rx="14" fill="#fff" stroke="#C9A45C" stroke-width="1.25"/>
    <text class="pill" x="115" y="71" text-anchor="middle">APPROVE OR EDIT PRICES</text>
    <rect x="214" y="52" width="178" height="28" rx="14" fill="#fff" stroke="#C9A45C" stroke-width="1.25"/>
    <text class="pill" x="303" y="71" text-anchor="middle">CONFIRM TIMELINE CHANGES</text>
  </g>

  <g class="arrow-hitl" marker-end="url(#wa-arr-h)">
    <path d="M600 184 V212"/>
  </g>
  <text class="pill" x="616" y="206" fill="#1E3557">approvals</text>

  <g transform="translate(200,220)">
    <rect class="app" width="800" height="196" rx="8"/>
    <text class="title" x="400" y="36" text-anchor="middle">Worthwell app (TanStack Start)</text>
    <text class="sub" x="400" y="58" text-anchor="middle">The product UI: setup, photos, item board, and export</text>
    <g transform="translate(70,80)">
      <rect class="inner" width="300" height="88" rx="6"/>
      <text class="label" x="150" y="36" text-anchor="middle">Deterministic pricing module</text>
      <text class="sub" x="150" y="60" text-anchor="middle">Starting prices and rounding, covered by tests</text>
    </g>
    <g transform="translate(430,80)">
      <rect class="inner" width="300" height="88" rx="6"/>
      <text class="label" x="150" y="36" text-anchor="middle">IndexedDB cache</text>
      <text class="sub" x="150" y="60" text-anchor="middle">On-device cache of the sale</text>
    </g>
  </g>

  <g class="arrow" marker-end="url(#wa-arr)">
    <path d="M390 416 V452"/>
    <path d="M930 416 V452"/>
  </g>

  <g transform="translate(80,460)">
    <rect class="box" width="620" height="220" rx="6"/>
    <text class="label" x="310" y="30" text-anchor="middle">OpenAI · GPT-6 Astra</text>
    <text class="sub" x="310" y="50" text-anchor="middle">Primary path. Calls go here first.</text>
    <g transform="translate(16,64)">
      <rect class="inner" width="288" height="140" rx="5"/>
      <text class="label" x="144" y="28" text-anchor="middle">Vision appraisal</text>
      <text class="sub" x="144" y="54" text-anchor="middle">Photo in, strict JSON out.</text>
      <text class="sub" x="144" y="74" text-anchor="middle">Draft items and ranges.</text>
      <text class="sub" x="144" y="102" text-anchor="middle">Does not set the final price.</text>
      <text class="sub" x="144" y="122" text-anchor="middle">Installed fixtures excluded.</text>
    </g>
    <g transform="translate(316,64)">
      <rect class="inner" width="288" height="140" rx="5"/>
      <text class="label" x="144" y="28" text-anchor="middle">Built-in web search</text>
      <text class="sub" x="144" y="54" text-anchor="middle">Comps, on request.</text>
      <text class="sub" x="144" y="74" text-anchor="middle">Up to 5 US resale listings.</text>
      <text class="sub" x="144" y="102" text-anchor="middle">Asking prices stay separate</text>
      <text class="sub" x="144" y="122" text-anchor="middle">from sold. Only cited listings kept.</text>
    </g>
  </g>

  <g transform="translate(740,460)">
    <rect class="cloud" width="380" height="220" rx="6"/>
    <text class="label" x="190" y="36" text-anchor="middle">Lovable Cloud</text>
    <text class="sub" x="190" y="70" text-anchor="middle">Postgres for sales, rooms,</text>
    <text class="sub" x="190" y="90" text-anchor="middle">items, and photos.</text>
    <text class="sub" x="190" y="122" text-anchor="middle">Google or email sign-in.</text>
    <text class="sub" x="190" y="142" text-anchor="middle">Private photo storage.</text>
    <text class="sub" x="190" y="174" text-anchor="middle">Owner-only rules on every table.</text>
  </g>

  <g class="arrow-dash" marker-end="url(#wa-arr)">
    <path d="M390 680 V704"/>
  </g>
  <text class="pill" x="406" y="700" fill="#1E3557">FALLBACK</text>

  <g transform="translate(80,712)">
    <rect class="fallback" width="620" height="80" rx="6"/>
    <text class="label" x="310" y="34" text-anchor="middle">Lovable AI gateway · fallback</text>
    <text class="sub" x="310" y="58" text-anchor="middle">Used when there is no key, or the OpenAI call fails.</text>
  </g>
</svg>
